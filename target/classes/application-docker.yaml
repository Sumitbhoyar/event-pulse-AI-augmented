spring:
  application:
    name: eventpulse
  datasource:
    url: jdbc:postgresql://postgres:5432/eventpulse
    username: eventpulse
    password: eventpulse
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  level:
    com.eventpulse: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

security:
  jwt:
    secret: ${JWT_SECRET:RXZlbnRQdWxzZVNlY3VyZUtleUZvckpXVEF1dGhlbnRpY2F0aW9uMjU2Qml0cw==}
    validity-ms: ${JWT_VALIDITY_MS:3600000}

