spring:
  application:
    name: eventpulse
  # PostgreSQL Configuration (uncomment when PostgreSQL is available)
  # datasource:
  #   url: jdbc:postgresql://localhost:5432/eventpulse
  #   username: eventpulse
  #   password: eventpulse
  #   driver-class-name: org.postgresql.Driver
  #   hikari:
  #     maximum-pool-size: 10
  #     minimum-idle: 5
  #     connection-timeout: 20000
  #     idle-timeout: 300000
  #     max-lifetime: 1200000
  
  # H2 In-Memory Database Configuration (for development)
  datasource:
    url: jdbc:h2:mem:eventpulse;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.eventpulse: DEBUG
    org.springframework.web: DEBUG
