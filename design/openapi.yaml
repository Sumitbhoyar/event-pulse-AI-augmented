openapi: 3.0.1
info:
  title: EventPulse API
  description: Event management system with real-time WebSocket support, JWT authentication, and metrics aggregation
  contact:
    name: EventPulse Team
    url: https://github.com/eventpulse
    email: support@eventpulse.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local Development
  - url: https://api.eventpulse.com
    description: Production

tags:
  - name: Authentication
    description: Authentication endpoints for JWT token management
  - name: Events
    description: Event management endpoints for creating and retrieving events
  - name: Metrics
    description: Event metrics and aggregation endpoints
  - name: Health
    description: Application health check endpoint (public)

paths:
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user and receive JWT token. For demo purposes, accepts any username/password combination.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: admin
              password: admin123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/events:
    post:
      tags:
        - Events
      summary: Create a new event
      description: Creates a new event and broadcasts it to WebSocket subscribers at /topic/events
      operationId: createEvent
      security:
        - bearer-jwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
            example:
              source: user-service
              type: LOGIN
              message: User successfully logged in
              timestamp: '2025-10-18T12:00:00Z'
      responses:
        '201':
          description: Event created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - JWT token missing or invalid

    get:
      tags:
        - Events
      summary: Retrieve events
      description: Retrieves events with optional filtering by type, source, and time range
      operationId: getEvents
      security:
        - bearer-jwt: []
      parameters:
        - name: type
          in: query
          description: Filter by event type
          required: false
          schema:
            type: string
          example: LOGIN
        - name: source
          in: query
          description: Filter by event source
          required: false
          schema:
            type: string
          example: user-service
        - name: from
          in: query
          description: Filter events from this timestamp (ISO 8601 format)
          required: false
          schema:
            type: string
            format: date-time
          example: '2025-01-01T00:00:00Z'
        - name: to
          in: query
          description: Filter events until this timestamp (ISO 8601 format)
          required: false
          schema:
            type: string
            format: date-time
          example: '2025-12-31T23:59:59Z'
      responses:
        '200':
          description: Events retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventResponse'
        '401':
          description: Unauthorized - JWT token missing or invalid

  /api/metrics:
    get:
      tags:
        - Metrics
      summary: Get event metrics
      description: Retrieves aggregated metrics including total count, counts by type, and counts by source
      operationId: getMetrics
      security:
        - bearer-jwt: []
      responses:
        '200':
          description: Metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
              example:
                totalCount: 150
                countByType:
                  LOGIN: 50
                  LOGOUT: 30
                  ERROR: 20
                  INFO: 50
                countBySource:
                  user-service: 80
                  payment-service: 40
                  notification-service: 30
        '401':
          description: Unauthorized - JWT token missing or invalid

  /api/health:
    get:
      tags:
        - Health
      summary: Health check
      description: Simple health check endpoint that returns application status. This endpoint is public and does not require authentication.
      operationId: health
      responses:
        '200':
          description: Application is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK

  /actuator/health:
    get:
      tags:
        - Actuator
      summary: Actuator health endpoint
      description: Detailed health information including database connectivity and disk space
      operationId: actuatorHealth
      responses:
        '200':
          description: Health information
          content:
            application/json:
              schema:
                type: object

  /actuator/metrics:
    get:
      tags:
        - Actuator
      summary: Actuator metrics endpoint
      description: Available metrics that can be queried
      operationId: actuatorMetrics
      responses:
        '200':
          description: List of available metrics
          content:
            application/json:
              schema:
                type: object

  /actuator/info:
    get:
      tags:
        - Actuator
      summary: Actuator info endpoint
      description: Application information including version, build details, and runtime environment
      operationId: actuatorInfo
      responses:
        '200':
          description: Application information
          content:
            application/json:
              schema:
                type: object

components:
  securitySchemes:
    bearer-jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /api/auth/login endpoint

  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Username for authentication
          example: admin
        password:
          type: string
          format: password
          description: Password for authentication
          example: admin123

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT authentication token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJhZG1pbiIsImlhdCI6MTY5...

    EventRequest:
      type: object
      required:
        - source
        - type
        - message
        - timestamp
      properties:
        source:
          type: string
          description: Source system or service that generated the event
          example: user-service
        type:
          type: string
          description: Event type classification
          example: LOGIN
        message:
          type: string
          description: Event message or description
          example: User successfully logged in
        timestamp:
          type: string
          format: date-time
          description: Event timestamp in ISO 8601 format
          example: '2025-10-18T12:00:00Z'

    EventResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique event identifier
          example: 123e4567-e89b-12d3-a456-426614174000
        source:
          type: string
          description: Source system or service that generated the event
          example: user-service
        type:
          type: string
          description: Event type classification
          example: LOGIN
        message:
          type: string
          description: Event message or description
          example: User successfully logged in
        timestamp:
          type: string
          format: date-time
          description: Event timestamp in ISO 8601 format
          example: '2025-10-18T12:00:00Z'

    MetricsResponse:
      type: object
      properties:
        totalCount:
          type: integer
          format: int64
          description: Total number of events in the system
          example: 150
        countByType:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Event counts grouped by type
          example:
            LOGIN: 50
            LOGOUT: 30
            ERROR: 20
        countBySource:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Event counts grouped by source
          example:
            user-service: 80
            payment-service: 40

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error code
          example: validation_error
        message:
          type: string
          description: Error message
          example: Source is required

