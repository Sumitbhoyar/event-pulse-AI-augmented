name: Pull Request CI

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]

jobs:
  # Job 1: Quick Build and Test
  quick-test:
    name: Quick Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: eventpulse_test
          POSTGRES_USER: eventpulse
          POSTGRES_PASSWORD: eventpulse
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Compile and test
      run: mvn clean test
      env:
        SPRING_PROFILES_ACTIVE: test
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/eventpulse_test
        SPRING_DATASOURCE_USERNAME: eventpulse
        SPRING_DATASOURCE_PASSWORD: eventpulse

    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Maven Tests (PR)
        path: target/surefire-reports/*.xml
        reporter: java-junit

  # Job 2: Code Quality Check
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Run Checkstyle
      run: mvn checkstyle:check
      continue-on-error: true

    - name: Run SpotBugs
      run: mvn spotbugs:check
      continue-on-error: true

    - name: Comment PR with quality results
      uses: actions/github-script@v6
      if: always()
      with:
        script: |
          const fs = require('fs');
          let comment = '## 📊 Code Quality Report\n\n';
          
          try {
            if (fs.existsSync('target/checkstyle-result.xml')) {
              comment += '✅ **Checkstyle**: Completed\n';
            } else {
              comment += '❌ **Checkstyle**: Failed or not run\n';
            }
          } catch (e) {
            comment += '❌ **Checkstyle**: Failed or not run\n';
          }
          
          try {
            if (fs.existsSync('target/spotbugsXml.xml')) {
              comment += '✅ **SpotBugs**: Completed\n';
            } else {
              comment += '❌ **SpotBugs**: Failed or not run\n';
            }
          } catch (e) {
            comment += '❌ **SpotBugs**: Failed or not run\n';
          }
          
          comment += '\n📝 Check the workflow logs for detailed results.';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  # Job 3: Security Check
  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Run OWASP dependency check
      run: mvn org.owasp:dependency-check-maven:check
      continue-on-error: true

    - name: Comment PR with security results
      uses: actions/github-script@v6
      if: always()
      with:
        script: |
          const fs = require('fs');
          let comment = '## 🔒 Security Scan Report\n\n';
          
          try {
            if (fs.existsSync('target/dependency-check-report.html')) {
              comment += '✅ **OWASP Dependency Check**: Completed\n';
              comment += '📋 Check the workflow artifacts for detailed vulnerability report.\n';
            } else {
              comment += '❌ **OWASP Dependency Check**: Failed or not run\n';
            }
          } catch (e) {
            comment += '❌ **OWASP Dependency Check**: Failed or not run\n';
          }
          
          comment += '\n⚠️ Review any security findings before merging.';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  # Job 4: Build Docker Image (without push)
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -t eventpulse:pr-${{ github.event.number }} .
        echo "✅ Docker image built successfully"
        docker images | grep eventpulse

  # Job 5: PR Status
  pr-status:
    name: PR Status
    runs-on: ubuntu-latest
    needs: [quick-test, code-quality, security-check, build-docker]
    if: always()
    
    steps:
    - name: Update PR status
      uses: actions/github-script@v6
      with:
        script: |
          const testStatus = '${{ needs.quick-test.result }}';
          const qualityStatus = '${{ needs.code-quality.result }}';
          const securityStatus = '${{ needs.security-check.result }}';
          const dockerStatus = '${{ needs.build-docker.result }}';
          
          let status = '## 🚀 Pull Request Status\n\n';
          
          status += `| Check | Status |\n`;
          status += `|-------|--------|\n`;
          status += `| Tests | ${testStatus === 'success' ? '✅ Passed' : '❌ Failed'} |\n`;
          status += `| Code Quality | ${qualityStatus === 'success' ? '✅ Passed' : '⚠️ Issues'} |\n`;
          status += `| Security | ${securityStatus === 'success' ? '✅ Passed' : '⚠️ Issues'} |\n`;
          status += `| Docker Build | ${dockerStatus === 'success' ? '✅ Passed' : '❌ Failed'} |\n`;
          
          const allPassed = testStatus === 'success' && dockerStatus === 'success';
          
          if (allPassed) {
            status += '\n🎉 **All critical checks passed!** Ready for review.';
          } else {
            status += '\n⚠️ **Some checks failed.** Please review and fix before merging.';
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: status
          });
