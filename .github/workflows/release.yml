name: Release

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string
      tag:
        description: 'Git tag'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Build and Test
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: eventpulse_test
          POSTGRES_USER: eventpulse
          POSTGRES_PASSWORD: eventpulse
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run full test suite
      run: mvn clean verify
      env:
        SPRING_PROFILES_ACTIVE: test
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/eventpulse_test
        SPRING_DATASOURCE_USERNAME: eventpulse
        SPRING_DATASOURCE_PASSWORD: eventpulse

    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Maven Tests (Release)
        path: target/surefire-reports/*.xml
        reporter: java-junit

  # Job 2: Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Run OWASP dependency check
      run: mvn org.owasp:dependency-check-maven:check

    - name: Upload security report
      uses: actions/upload-artifact@v3
      with:
        name: security-report
        path: target/dependency-check-report.html

  # Job 3: Build and Push Docker Image
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    
    permissions:
      contents: read
      packages: write

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          VCS_REF=${{ github.sha }}
          VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}

  # Job 4: Create Release Notes
  create-release-notes:
    name: Create Release Notes
    runs-on: ubuntu-latest
    needs: [build-and-push]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate changelog
      id: changelog
      run: |
        # Get the previous tag
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
        CURRENT_TAG=${GITHUB_REF_NAME}
        
        echo "Previous tag: $PREVIOUS_TAG"
        echo "Current tag: $CURRENT_TAG"
        
        # Generate changelog
        if [ -z "$PREVIOUS_TAG" ]; then
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
        else
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges $PREVIOUS_TAG..HEAD)
        fi
        
        echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create release notes
      run: |
        cat > release-notes.md << EOF
        ## 🚀 EventPulse Release ${{ github.event.release.tag_name || github.event.inputs.tag }}
        
        ### 📦 Docker Image
        
        \`\`\`bash
        docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name || github.event.inputs.tag }}
        \`\`\`
        
        ### 🔗 Quick Links
        
        - **Swagger UI**: [API Documentation](https://eventpulse.com/swagger-ui.html)
        - **Health Check**: [Application Status](https://eventpulse.com/api/health)
        - **Metrics**: [Application Metrics](https://eventpulse.com/actuator/metrics)
        
        ### 📊 What's New
        
        ${{ steps.changelog.outputs.CHANGELOG }}
        
        ### 🛠️ Installation
        
        #### Docker Compose
        \`\`\`bash
        git clone https://github.com/${{ github.repository }}.git
        cd EventPulse
        docker-compose up -d
        \`\`\`
        
        #### Docker
        \`\`\`bash
        docker run -d \\
          --name eventpulse \\
          -p 8080:8080 \\
          -e SPRING_DATASOURCE_URL=jdbc:postgresql://your-db:5432/eventpulse \\
          -e SPRING_DATASOURCE_USERNAME=eventpulse \\
          -e SPRING_DATASOURCE_PASSWORD=eventpulse \\
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name || github.event.inputs.tag }}
        \`\`\`
        
        ### 🔐 Default Credentials
        
        - **Username**: admin
        - **Password**: password
        - **Role**: ADMIN
        
        ### 📚 Documentation
        
        - [API Documentation](https://eventpulse.com/swagger-ui.html)
        - [Docker Setup Guide](DOCKER_README.md)
        - [Observability Guide](OBSERVABILITY_README.md)
        
        ### 🐛 Bug Reports & Feature Requests
        
        Please report issues and feature requests on [GitHub Issues](https://github.com/${{ github.repository }}/issues).
        
        ---
        
        **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.changelog.outputs.PREVIOUS_TAG }}...${{ github.event.release.tag_name || github.event.inputs.tag }}
        EOF

    - name: Upload release notes
      uses: actions/upload-artifact@v3
      with:
        name: release-notes
        path: release-notes.md

  # Job 5: Update Release
  update-release:
    name: Update Release
    runs-on: ubuntu-latest
    needs: [create-release-notes]
    if: github.event_name == 'release'
    
    steps:
    - name: Download release notes
      uses: actions/download-artifact@v3
      with:
        name: release-notes
        path: .

    - name: Update release
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const releaseNotes = fs.readFileSync('release-notes/release-notes.md', 'utf8');
          
          github.rest.repos.updateRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            release_id: context.payload.release.id,
            body: releaseNotes
          });

  # Job 6: Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'release'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to production
      run: |
        echo "🚀 Deploying EventPulse ${{ github.event.release.tag_name }} to production..."
        echo "📦 Docker image: ${{ needs.build-and-push.outputs.image-tag }}"
        
        # Add your production deployment logic here
        # Example: kubectl apply -f k8s/production/
        # Example: docker-compose -f docker-compose.prod.yml up -d
        
        echo "✅ Deployment completed successfully!"

  # Job 7: Notification
  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-production]
    if: always() && github.event_name == 'release'

    steps:
    - name: Notify success
      if: ${{ needs.deploy-production.result == 'success' }}
      run: |
        echo "🎉 EventPulse ${{ github.event.release.tag_name }} released successfully!"
        echo "🐳 Docker image: ${{ needs.build-and-push.outputs.image-tag }}"
        echo "🚀 Production deployment: Completed"
        echo "📚 Documentation: https://eventpulse.com/swagger-ui.html"

    - name: Notify failure
      if: ${{ needs.deploy-production.result == 'failure' }}
      run: |
        echo "❌ EventPulse ${{ github.event.release.tag_name }} release failed!"
        echo "🔍 Check the workflow logs for details"
        exit 1
